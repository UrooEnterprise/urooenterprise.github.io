<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uroo Enterprise - Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #1a1a1a; }
        p { color: #666; }
        
        /* Product Grid */
        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Product Card */
        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }
        .out-of-stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4d4d;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .category { font-size: 12px; color: #888; text-transform: uppercase; margin-top: 10px; display: block; }
        .title { font-size: 16px; font-weight: bold; margin: 6px 0; color: #222; }
        .desc { font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.4; }
        
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }
        .price { font-size: 18px; font-weight: bold; color: #2e7d32; }
        .mrp { font-size: 14px; color: #888; text-decoration: line-through; }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .buy-btn:hover { background: #115293; }
        .buy-btn:disabled { background: #cccccc; color: #666; cursor: not-allowed; }

        .marketplaces {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .marketplaces a { text-decoration: none; font-weight: 500; }
        .amazon-link { color: #ff9900; }
        .meesho-link { color: #d81b60; }
    </style>
</head>
<body>

    <header>
        <h1>Uroo Enterprise</h1>
        <p>Original Gemstones, Vastu Decor & Spiritual Accessories</p>
    </header>

    <!-- Product Grid Container -->
    <div id="product-grid">
        <p style="text-align: center; grid-column: 1 / -1; color: #666;">Loading products...</p>
    </div>

    <script>
        async function loadStoreProducts() {
            try {
                // Fetch the CSV file from the root of your GitHub repository
                const response = await fetch('products.csv?' + new Date().getTime()); // Cache-buster added
                if (!response.ok) throw new Error("Could not load products.csv");
                
                const csvText = await response.text();
                
                // Split rows and clean empty lines
                const rows = csvText.split('\n').map(row => row.trim()).filter(row => row.length > 0);
                if (rows.length < 2) return;
                
                const headers = rows[0].split(',').map(h => h.trim());
                const productContainer = document.getElementById('product-grid');
                productContainer.innerHTML = '';

                // Loop through product rows
                for (let i = 1; i < rows.length; i++) {
                    const values = rows[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || rows[i].split(',');
                    const product = {};
                    
                    headers.forEach((header, index) => {
                        let val = values[index] ? values[index].trim() : '';
                        if (val.startsWith('"') && val.endsWith('"')) {
                            val = val.slice(1, -1); // Strip quotes
                        }
                        product[header] = val;
                    });

                    const isOutStock = product.stock && product.stock.toLowerCase().includes('out');

                    const cardHTML = `
                        <div class="product-card">
                            ${isOutStock ? '<span class="out-of-stock-badge">Out of Stock</span>' : ''}
                            <img src="${product.image}" alt="${product.title}">
                            <div>
                                <span class="category">${product.category}</span>
                                <div class="title">${product.title}</div>
                                <div class="desc">${product.description}</div>
                            </div>
                            <div>
                                <div class="price-row">
                                    <span class="price">₹${product.price}</span>
                                    <span class="mrp">₹${product.mrp}</span>
                                </div>
                                <button class="buy-btn" ${isOutStock ? 'disabled' : ''} onclick="handleCheckout('${product.sku}', '${product.title}', ${product.price})">
                                    ${isOutStock ? 'Sold Out' : 'Buy Direct (UPI)'}
                                </button>
                                <div class="marketplaces">
                                    <a href="${product.amazon}" target="_blank" class="amazon-link">View on Amazon</a>
                                    <a href="${product.meesho}" target="_blank" class="meesho-link">View on Meesho</a>
                                </div>
                            </div>
                        </div>
                    `;
                    productContainer.innerHTML += cardHTML;
                }
            } catch (error) {
                console.error("Error loading products:", error);
                document.getElementById('product-grid').innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Failed to load catalog. Please check your products.csv file format.</p>';
            }
        }

        function handleCheckout(sku, title, price) {
            alert(`Selected: ${title} (${sku}) for ₹${price}\nNext step: Connecting this to your Google Sheet order backend & UPI payment link!`);
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
