<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uroo Enterprise - Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #1a1a1a; }
        p { color: #666; }
        
        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }
        .out-of-stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4d4d;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .category { font-size: 12px; color: #888; text-transform: uppercase; margin-top: 10px; display: block; }
        .title { font-size: 16px; font-weight: bold; margin: 6px 0; color: #222; }
        .desc { font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.4; }
        
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }
        .price { font-size: 18px; font-weight: bold; color: #2e7d32; }
        .mrp { font-size: 14px; color: #888; text-decoration: line-through; }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .buy-btn:disabled { background: #cccccc; color: #666; cursor: not-allowed; }

        .marketplaces {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .marketplaces a { text-decoration: none; font-weight: 500; }
        .amazon-link { color: #ff9900; }
        .meesho-link { color: #d81b60; }
    </style>
</head>
<body>

    <header>
        <h1>Uroo Enterprise</h1>
        <p>Original Gemstones, Vastu Decor & Spiritual Accessories</p>
    </header>

    <div id="product-grid">
        <p style="text-align: center; grid-column: 1 / -1; color: #666;">Loading products...</p>
    </div>

    <script>
        async function loadMarkdownCatalog() {
            try {
                const response = await fetch('products.md?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Could not load products.md");
                
                const markdownText = await response.text();
                const lines = markdownText.split('\n').map(l => l.trim()).filter(l => l.startsWith('|'));
                
                if (lines.length < 3) throw new Error("Invalid table format");

                const productContainer = document.getElementById('product-grid');
                productContainer.innerHTML = '';

                // Start from line 2 to skip header and separator lines
                for (let i = 2; i < lines.length; i++) {
                    const cols = lines[i].split('|').map(c => c.trim()).filter(c => c !== '');
                    if (cols.length < 10) continue;

                    const [sku, title, price, mrp, category, stock, image, amazon, meesho, description] = cols;
                    const isOutStock = stock.toLowerCase().includes('out');

                    const cardHTML = `
                        <div class="product-card">
                            ${isOutStock ? '<span class="out-of-stock-badge">Out of Stock</span>' : ''}
                            <img src="${image}" alt="${title}">
                            <div>
                                <span class="category">${category}</span>
                                <div class="title">${title}</div>
                                <div class="desc">${description}</div>
                            </div>
                            <div>
                                <div class="price-row">
                                    <span class="price">₹${price}</span>
                                    <span class="mrp">₹${mrp}</span>
                                </div>
                                <button class="buy-btn" ${isOutStock ? 'disabled' : ''} onclick="alert('Checkout for ${sku}')">
                                    ${isOutStock ? 'Sold Out' : 'Buy Direct (UPI)'}
                                </button>
                                <div class="marketplaces">
                                    <a href="${amazon}" target="_blank" class="amazon-link">Amazon</a>
                                    <a href="${meesho}" target="_blank" class="meesho-link">Meesho</a>
                                </div>
                            </div>
                        </div>
                    `;
                    productContainer.innerHTML += cardHTML;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('product-grid').innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Failed to load catalog. Please check products.md file.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadMarkdownCatalog);
    </script>
</body>
</html>
